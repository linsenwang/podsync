# 容器内全局 yt-dlp 配置（安装到 /etc/yt-dlp.conf）
#   1. 为 BiliBili 添加必要的请求头，降低被封概率
#   2. 加重试与退避：代理会间歇性中断 TLS 握手，yt-dlp 默认只重试 3 次
#      且 --retry-sleep 默认为空（即重试之间不等待），几秒内就耗尽重试并误报
#      "Video unavailable"。加上退避后可熬过代理的短时抖动。
--add-header "Referer:https://www.bilibili.com/"
--user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36"
--add-header "Accept-Language:zh-CN,zh;q=0.9,en;q=0.8"
--socket-timeout 30
--extractor-retries 10
--file-access-retries 5
--retry-sleep extractor:exp=2:20
--retry-sleep http:exp=2:20
