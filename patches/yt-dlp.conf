# 容器内全局 yt-dlp 配置（安装到 /etc/yt-dlp.conf）
#   1. 为 BiliBili 添加必要的请求头，降低被封概率
#   2. 加重试与退避：代理会间歇性中断 TLS 连接（实测新连接失败率 60%+，
#      Cloudflare 5MB 文件 5 次只成 1 次），yt-dlp 默认只重试 3 次且
#      --retry-sleep 为空，几秒内就耗尽重试并误报 "Video unavailable"。
#   3. --retries 默认 10 次，实测下载 25MB 音频到 76% 就耗尽放弃；
#      提到 30 次后同一集 176s 正常下完（用到第 13 次重试）。
#      退避上限从 20s 降到 10s：多留重试次数，同时守住 podsync 10 分钟
#      的下载超时（[downloader] timeout 默认值）。
#      不要用 --http-chunk-size：分片会把请求数放大几十倍，在丢包链路上
#      反而更快耗尽重试（实测 30 次仍失败）。
--add-header "Referer:https://www.bilibili.com/"
--user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36"
--add-header "Accept-Language:zh-CN,zh;q=0.9,en;q=0.8"
--socket-timeout 30
--extractor-retries 10
--retries 30
--file-access-retries 5
--retry-sleep extractor:exp=2:20
--retry-sleep http:exp=2:10
